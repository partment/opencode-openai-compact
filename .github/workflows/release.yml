name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify OIDC availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC token request variables are unavailable; ensure the job has id-token: write permission"
            exit 1
          fi

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE="opencode-openai-compact@$VERSION"

          if npm view "$PACKAGE" version --json >/dev/null 2>&1; then
            echo "$PACKAGE is already published; treating publish as successful"
            exit 0
          fi

          if npm publish --provenance; then
            exit 0
          fi

          if npm view "$PACKAGE" version --json >/dev/null 2>&1; then
            echo "$PACKAGE was published despite the publish command failure; treating publish as successful"
            exit 0
          fi

          echo "Failed to publish $PACKAGE"
          exit 1

      - name: Verify published version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE="opencode-openai-compact@$VERSION"
          for attempt in 1 2 3 4 5; do
            if PUBLISHED=$(npm view "$PACKAGE" version 2>&1); then
              echo "Published $PACKAGE ($PUBLISHED)"
              exit 0
            fi
            echo "Package not visible yet; retrying ($attempt/5): $PUBLISHED"
            sleep 10
          done
          echo "Failed to verify $PACKAGE on npm"
          exit 1
